spring.application.name=serverless-apis

# Virtual threads (Java 21 / Project Loom)
spring.threads.virtual.enabled=true

# MongoDB — set MONGODB_URI env var in production (Cloud Run secret)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=serverless_apis

# Actuator — Cloud Run uses /actuator/health for liveness/readiness probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Server
server.port=8080
server.forward-headers-strategy=framework

# SpringDoc / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# API key — set API_KEY env var in production (Cloud Run secret)
api.key=${API_KEY:local-dev-key}
